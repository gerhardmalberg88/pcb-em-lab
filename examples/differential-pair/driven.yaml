{
  "name": "Standalone differential-pair two-port network",
  "project_root": ".",
  "board": "board.kicad_pcb",
  "output": "../../results/examples/differential-pair/3d",
  "mode": "3d",
  "analysis": "driven",
  "exports": {"step": true},
  "air_margin_mm": 3,
  "frequencies_hz": [100000000, 200000000, 300000000, 400000000, 500000000, 600000000, 700000000, 800000000],
  "ports": [
    {"name": "input", "positive": "J1:1", "negative": "J1:2", "positive_net": "P", "negative_net": "N", "positive_xy_mm": [3.5, 5.3], "negative_xy_mm": [3.5, 6.7], "width_mm": 0.4, "reference_ohms": 100},
    {"name": "output", "positive": "J2:1", "negative": "J2:2", "positive_net": "P", "negative_net": "N", "positive_xy_mm": [16.5, 5.3], "negative_xy_mm": [16.5, 6.7], "width_mm": 0.4, "reference_ohms": 100}
  ],
  "mesh": {"fine_mm": 0.35, "coarse_mm": 2, "scale": 1, "order": 1, "threads": 1},
  "materials": {"substrate_epsilon_r": 4.2, "soldermask_epsilon_r": 3.3},
  "execution": {"backend": "cpu", "mpi_ranks": 2, "threads_per_rank": 1, "gpu_count": 1},
  "assumptions": [
    "Synthetic demonstration board; two differential ports referenced to 100 ohms, 13 mm apart.",
    "The 3D generator uses PEC copper sheets at saved layer midplanes and estimated lossless dielectric materials.",
    "Open trace/pad stubs beyond the calibration planes remain in the model; there are no connector bodies or external cables.",
    "Coarse first-order teaching mesh and finite absorbing air boundary; not a converged impedance or EMC prediction.",
    "A fitted circuit is exported only if the existing fit/passivity checks pass over the sampled band."
  ]
}
